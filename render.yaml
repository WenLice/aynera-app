# Render blueprint for the Aynera app DEMO (branch `demo`).
#
# A static site built from the same screens as `dev`, but with no server behind it: every API
# call is answered on the visitor's device (src/api/demoBackend.ts). No OTP by SMS or email, no
# keys, no database — someone can walk the whole registration and into the app. What they enter
# stays in their own browser.
#
# Separate from the real app site (aynera-app, branch main). Auto-deploys on every push to demo.
services:
  - type: web
    name: aynera-app-demo
    runtime: static
    plan: free
    branch: demo
    # `expo export` forces NODE_ENV to production itself, so it loads .env.production without
    # being told to. Setting NODE_ENV here would be noise, and the Expo docs recommend against
    # using it to select env files at all.
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: ./dist
    routes:
      # Expo Router serves one HTML document and routes in the browser, so any unknown path
      # must return index.html rather than a 404 — otherwise a refresh mid-registration, or a
      # pasted link, drops the member on an error page.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
